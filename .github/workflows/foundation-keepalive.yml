name: Foundation keep-alive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/foundation-keepalive.yml
  schedule:
    # Ten-minute intervals, offset from the start of the hour to reduce queues.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

# No checkout, credentials, application data, or repository permissions needed.
permissions: {}

concurrency:
  group: foundation-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Foundation API liveness
        env:
          FOUNDATION_HEALTH_URL: https://foundation-website-7o9d.onrender.com/health
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 90 --retry 1 --retry-delay 5 \
            --user-agent 'Foundation-keepalive/1.0' "$FOUNDATION_HEALTH_URL")"
          printf '%s' "$body" | python3 -c 'import json, sys; result = json.load(sys.stdin); assert result.get("status") == "ok" and result.get("service") == "foundation-scholarship-api", "Unexpected Foundation health response"; print("Foundation API is healthy")'
